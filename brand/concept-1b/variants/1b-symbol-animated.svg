<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-labelledby="t d"><title id="t">Tempoloon concept 1b symbol (animated)</title><desc id="d">Tempoloon concept 1b: brain-bubble outline (5 arcs, round bottom) with a circular loading gauge (270-degree ring, thickness and colour grow calm to rising to break) and a small AI spark. Ring rotates unless the user prefers reduced motion.</desc><style>@media (prefers-reduced-motion: no-preference){.spin{transform-origin:100px 106px;animation:tempoloon-spin 2.4s linear infinite}}@keyframes tempoloon-spin{to{transform:rotate(360deg)}}</style><path d="M24 112 A23.6 23.6 0 0 1 34.2 74 A27.4 27.4 0 0 1 67.9 43.1 A38.5 38.5 0 0 1 132.1 43.1 A27.4 27.4 0 0 1 165.8 74 A23.6 23.6 0 0 1 176 112 C176 148 150 168 110 168 Q84 172 52 196 Q58 174 68 165 C42 159 24 138 24 112Z" fill="none" stroke="#4338CA" stroke-width="9" stroke-linejoin="round"/><g class="spin"><path d="M71.7 134.3 A40 40 0 0 1 98.6 66" fill="none" stroke="#2F5DA8" stroke-width="8" stroke-linecap="round"/><path d="M101.4 66 A40 40 0 0 1 136.4 89.4" fill="none" stroke="#B45F06" stroke-width="11" stroke-linecap="round"/><path d="M137.5 92 A40 40 0 0 1 128.3 134.3" fill="none" stroke="#B3124F" stroke-width="14" stroke-linecap="round"/></g><path d="M100 90 Q102.6 103.4 116 106 Q102.6 108.6 100 122 Q97.4 108.6 84 106 Q97.4 103.4 100 90Z" fill="#0D1B2A"/></svg>
